<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多巴胺日历 V4</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7EC8A0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="多巴胺日历">
<style>
:root{--mint:#7EC8A0;--lime:#C7E990;--purple:#B5A0D8;--blue:#8EC8E8;--bg-page:#FFF9F0;--bg-card:#FFF;--bg-header:linear-gradient(135deg,#7EC8A0,#8EC8E8);--bg-today:#E8F8F0;--text:#2D3436;--text-muted:#636E72;--text-light:#B2BEC3;--border:#E0E8E3;--red:#E74C3C;--iblue:#3498DB}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-page);color:var(--text);min-height:100dvh}
.app-container{display:flex;flex-direction:column;min-height:100dvh;max-width:1200px;margin:0 auto}
.main-content{display:flex;flex:1;overflow:hidden}
.header{background:var(--bg-header);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;box-shadow:0 2px 12px rgba(126,200,160,0.3)}
.nav-btn,.today-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:0.85rem;font-family:inherit}
.nav-btn:hover,.today-btn:hover{background:rgba(255,255,255,0.35)}
.nav-btn{font-size:1.1rem;padding:4px 10px}
.year-text,.month-text{cursor:pointer;font-weight:700;font-size:1.3rem;padding:2px 4px;border-radius:8px}
.year-text:hover,.month-text:hover{background:rgba(255,255,255,0.25)}
.picker-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:200;justify-content:center;align-items:center}
.picker-overlay.show{display:flex}
.picker-popup{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 40px rgba(0,0,0,0.2);max-width:360px;width:90%}
.picker-popup h3{text-align:center;margin-bottom:10px}
.picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.picker-item{padding:8px;text-align:center;border-radius:10px;cursor:pointer;font-size:0.85rem;background:#f5f5f5}
.picker-item:hover{background:var(--mint);color:#fff}
.picker-item.active{background:var(--purple);color:#fff;font-weight:700}
.calendar-panel{flex:2;padding:12px 16px;display:flex;flex-direction:column;overflow-y:auto}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.weekday-cell{text-align:center;font-size:0.8rem;font-weight:600;color:var(--text-muted);padding:2px 0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1}
.calendar-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px;border-radius:8px;cursor:pointer;position:relative;min-height:50px;background:var(--bg-card);box-shadow:0 1px 2px rgba(0,0,0,0.04);overflow:hidden}
.calendar-cell:hover{background:#F0F8F4;transform:scale(1.03)}
.calendar-cell.today{background:var(--bg-today);box-shadow:0 2px 8px rgba(126,200,160,0.35)}
.calendar-cell.today .day-num{background:var(--lime);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700}
.calendar-cell.selected{outline:3px solid var(--purple);outline-offset:-3px}
.calendar-cell.other-month{opacity:0.35;pointer-events:none}
.calendar-cell.holiday{background:#e8f5ee}
.day-num{font-size:0.85rem;margin-bottom:1px;z-index:1}
.lunar-text{font-size:0.6rem;color:var(--text-muted);line-height:1.1;z-index:1}
.lunar-text.term{color:#7EC8A0}.lunar-text.festival{color:#2E7D52;font-weight:600}
.lunar-text.observance{color:#2E7D52;font-weight:600;font-size:0.62rem}
.holiday-label{font-size:0.58rem;color:#2E7D52;font-weight:600}
.memorial-icon{font-size:0.7rem;position:absolute;top:1px;right:2px;z-index:1}
.task-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;z-index:1}
.task-dot{width:5px;height:5px;border-radius:50%}
.side-panel{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:8px;background:var(--bg-card);border-left:1px solid var(--border);overflow-y:auto;min-width:270px}
.panel-date{font-size:1rem;font-weight:700;text-align:center}
.panel-date small{display:block;font-weight:400;font-size:0.75rem;color:var(--text-muted)}
.panel-empty{text-align:center;color:var(--text-light);padding:20px 10px;font-size:0.85rem;line-height:1.8}
.add-task-row{display:flex;gap:5px;align-items:center}
.add-task-input{flex:1;padding:7px 10px;border:2px solid var(--border);border-radius:18px;font-size:0.82rem;font-family:inherit;outline:none;background:#fafafa}
.add-task-input:focus{border-color:var(--purple)}
.priority-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;font-size:0.6rem;display:flex;align-items:center;justify-content:center}
.priority-dot.p0{background:#eee}.priority-dot.p1{background:#DBEAFE}.priority-dot.p2{background:#FFF3E0}.priority-dot.p3{background:#FFE0E0}
.priority-dot.sel{border-color:var(--text);transform:scale(1.2)}
.add-task-btn{padding:7px 14px;background:var(--purple);color:#fff;border:none;border-radius:18px;cursor:pointer;font-family:inherit;font-size:0.82rem;white-space:nowrap}
.task-list{display:flex;flex-direction:column;gap:3px}
.task-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;border-left:3px solid transparent}
.task-item:hover{background:#fafafa}
.task-item.p0{border-left-color:#ddd}.task-item.p1{border-left-color:var(--iblue)}
.task-item.p2{border-left-color:#F39C12}.task-item.p3{border-left-color:var(--red)}
.task-checkbox{appearance:none;width:18px;height:18px;border:2px solid #ddd;border-radius:50%;cursor:pointer;flex-shrink:0;position:relative}
.task-checkbox:checked{background:var(--mint);border-color:var(--mint)}
.task-checkbox:checked::after{content:'\2713';position:absolute;top:-1px;left:2px;color:#fff;font-size:11px;font-weight:700}
.task-text{flex:1;font-size:0.85rem;word-break:break-word}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-light)}
.task-countdown{font-size:0.7rem;color:var(--red);font-weight:600}
.task-delete{background:none;border:none;cursor:pointer;font-size:0.85rem;opacity:0;color:var(--text-light)}
.task-item:hover .task-delete{opacity:1}
.task-delete:hover{color:#EDCFD0}
.memorial-section{border-top:1px solid var(--border);padding-top:6px}
.memorial-section h4{font-size:0.78rem;color:var(--text-muted);margin-bottom:4px}
.memorial-item{display:flex;align-items:center;gap:6px;font-size:0.8rem;padding:2px 0}
.memorial-countdown{font-size:0.72rem;color:var(--red);margin-left:auto}
.memorial-clickable{cursor:pointer;border-radius:6px;padding:3px 6px}
.memorial-clickable:hover{background:#f0f8f4}
.btn-add-memorial{padding:5px 12px;border:2px dashed var(--border);border-radius:14px;background:none;cursor:pointer;font-family:inherit;font-size:0.78rem;color:var(--text-muted);width:100%}
.btn-add-memorial:hover{border-color:var(--mint);color:var(--mint)}
.mood-section h4,.journal-section h4{font-size:0.78rem;color:var(--text-muted);margin-bottom:4px}
.mood-grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.mood-btn{font-size:1.2rem;cursor:pointer;padding:2px;border-radius:6px;border:2px solid transparent;background:none}
.mood-btn:hover{background:#f0f8f4;transform:scale(1.2)}
.mood-btn.sel2{border-color:var(--mint);background:#e8f5ee;transform:scale(1.25)}
.journal-textarea{width:100%;min-height:50px;padding:6px 10px;border:2px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.8rem;resize:vertical;outline:none;background:#fafafa}
.journal-textarea:focus{border-color:var(--mint)}
.progress-section{border-top:1px solid var(--border);padding-top:8px}
.progress-text{font-size:0.78rem;color:var(--text-muted);text-align:center;margin-bottom:4px}
.progress-bar{height:5px;background:#eee;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--purple));border-radius:3px;transition:width 0.4s}
.sync-section{border-top:1px solid var(--border);padding-top:8px;display:flex;gap:5px}
.sync-btn{flex:1;padding:5px 8px;border:2px solid var(--border);border-radius:14px;background:#fff;cursor:pointer;font-size:0.75rem;font-family:inherit;color:var(--text-muted)}
.sync-btn:hover{border-color:var(--mint);color:var(--mint)}
.celebration-particle{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0);opacity:0}}
.btn-save{background:var(--mint);color:#fff;padding:8px 18px;border:none;border-radius:18px;cursor:pointer;font-family:inherit}
.btn-cancel{background:#eee;padding:8px 18px;border:none;border-radius:18px;cursor:pointer;font-family:inherit}
.btn-delete{background:var(--red);color:#fff;padding:6px 14px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-size:0.8rem}
.btn-row{display:flex;gap:6px}
@media(max-width:768px){.main-content{flex-direction:column;overflow:visible}.calendar-panel{flex:none;padding:6px 4px}.calendar-cell{min-height:38px;padding:1px;border-radius:5px}.day-num{font-size:0.72rem}.lunar-text{font-size:0.5rem}.side-panel{flex:none;border-left:none;border-top:1px solid var(--border);min-width:auto}.header{padding:6px 8px;gap:4px}.year-text,.month-text{font-size:1rem}}
</style>
</head>
<body>
<div class="app-container" id="app">
<header class="header">
<button class="nav-btn" data-action="prev">&#9664;</button>
<span class="year-text" id="year-text">2026</span><span>年</span>
<span class="month-text" id="month-text">6月</span>
<button class="nav-btn" data-action="next">&#9654;</button>
<button class="today-btn" data-action="today">今天</button>
<button class="today-btn" id="btn-login" style="background:rgba(255,255,255,0.3);" onclick="openLogin()">登录</button>
<button class="today-btn" style="background:rgba(255,255,255,0.2);" onclick="showHelp()">帮助</button>
</header>
<div class="main-content">
<section class="calendar-panel" id="calendar-panel"></section>
<aside class="side-panel" id="side-panel"></aside>
</div>
</div>
<div class="picker-overlay" id="year-picker-overlay"><div class="picker-popup" id="year-picker-popup"></div></div>
<div class="picker-overlay" id="month-picker-overlay"><div class="picker-popup" id="month-picker-popup"></div></div>
<div class="modal-overlay" id="memorial-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:300;justify-content:center;align-items:center;"><div class="modal-box" id="memorial-modal-box" style="background:#fff;border-radius:16px;padding:20px;max-width:360px;width:90%"></div></div>
<div class="modal-overlay" id="login-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:400;justify-content:center;align-items:center;"><div class="modal-box" id="login-modal-box" style="background:#fff;border-radius:16px;padding:20px;max-width:360px;width:90%"></div></div>

<script>
// ==================== 日历脚本 V4 ====================
console.log('日历脚本开始加载...');

// Supabase 配置
var SUPABASE_URL='https://futrwpbrnuxwhqvxsnxb.supabase.co';
var SUPABASE_KEY='sb_publishable_C4jFxMZExcjBEOtIbV2nTg_Hoyrsa1U';
var currentUser=null;
var syncTimer=null;

// 常量
var STORAGE_KEY='dopamineCalV4';
var DOT_COLORS=['#7EC8A0','#C7E990','#B5A0D8','#8EC8E8','#EDCFD0','#8ED8B8'];
var WEEKDAY_LABELS=['一','二','三','四','五','六','日'];
var MOOD_EMOJIS=['😊','😄','😍','🤩','😌','😐','😢','😡','😴','🤒','🎉','💪','❤️','🌟','💡','🔥','🥳','😎','🤗','🥰','😤','😭','🤯','😱','🫠','🌈','☀️','🌙','🍀','🎵'];
var MEM_TYPES={birthday:'🎂 生日',anniversary:'💍 纪念日',holiday:'🎉 节日',memorial:'🕯 忌日',custom:'📌 自定义',countup:'📆 正数日',countdown:'⏳ 倒数日'};
var MEM_ICONS={birthday:'🎂',anniversary:'💍',holiday:'🎉',memorial:'🕯',custom:'📌',countup:'📆',countdown:'⏳'};

// 状态
var state={currentYear:new Date().getFullYear(),currentMonth:new Date().getMonth(),selectedDate:null,tasksByDate:{},memorials:[],priorityFilter:null,moods:{},journals:{}};

// 工具函数
function getTodayKey(){var d=new Date();return dateKey(d.getFullYear(),d.getMonth(),d.getDate());}
function dateKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
function sanitize(t){return t.replace(/</g,'&lt;').replace(/>/g,'&gt;').trim();}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}

// ==================== 登录弹窗（全局函数，HTML onclick 直接调用）====================
window.openLogin=function(){
  var box=document.getElementById('login-modal-box');
  var modal=document.getElementById('login-modal');
  if(currentUser){
    box.innerHTML='<h3 style="text-align:center">已登录</h3><p style="text-align:center;color:#636E72">'+currentUser.email+'</p><p style="text-align:center">云端同步中</p><div class="btn-row" style="justify-content:center;margin-top:12px"><button class="btn-delete" id="btn-logout">退出</button><button class="btn-cancel" id="btn-login-close">关闭</button></div>';
    modal.style.display='flex';
    setTimeout(function(){
      var b1=document.getElementById('btn-logout'),b2=document.getElementById('btn-login-close');
      if(b1)b1.onclick=function(){currentUser=null;updateLoginBtn();loadLocalState();renderApp();modal.style.display='none';};
      if(b2)b2.onclick=function(){modal.style.display='none';};
    },50);
  } else {
    box.innerHTML='<h3 style="text-align:center">登录同步</h3><p style="font-size:0.85rem;color:#636E72;text-align:center">登录后多设备自动同步数据</p><input type="email" id="login-email" placeholder="邮箱" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:10px;font-size:0.9rem;margin-bottom:6px"><input type="password" id="login-password" placeholder="密码" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:10px;font-size:0.9rem;margin-bottom:6px"><div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn-save" id="btn-login-go" style="flex:1">登录</button><button class="btn-cancel" id="btn-signup-go" style="flex:1">注册</button></div><p style="font-size:0.65rem;color:#999;text-align:center">密码需6位以上，首次请点注册</p><button class="btn-cancel" id="btn-login-close2" style="display:block;margin:8px auto 0">关闭</button>';
    modal.style.display='flex';
    setTimeout(function(){
      var bLogin=document.getElementById('btn-login-go'),bSignup=document.getElementById('btn-signup-go'),bClose=document.getElementById('btn-login-close2');
      if(bLogin)bLogin.onclick=async function(){
        var email=document.getElementById('login-email').value.trim(),pw=document.getElementById('login-password').value;
        if(!email||!pw){alert('请输入邮箱和密码');return;}
        try{var user=await signIn(email,pw);currentUser=user;updateLoginBtn();saveLocalState(dumpState());await loadState();renderApp();modal.style.display='none';}
        catch(e){alert(e.message);}
      };
      if(bSignup)bSignup.onclick=async function(){
        var email=document.getElementById('login-email').value.trim(),pw=document.getElementById('login-password').value;
        if(!email||!pw){alert('请输入邮箱和密码');return;}
        if(pw.length<6){alert('密码至少6位');return;}
        try{var user=await signUp(email,pw);currentUser=user;updateLoginBtn();saveLocalState(dumpState());await loadState();renderApp();modal.style.display='none';}
        catch(e){alert(e.message);}
      };
      if(bClose)bClose.onclick=function(){modal.style.display='none';};
    },50);
  }
};

// ==================== Supabase ====================
async function signUp(email,password){
  var r=await fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password,email_confirm:true})});
  if(!r.ok){var e=await r.json();throw new Error(e.msg||e.message||'注册失败');}
  var data=await r.json();
  return{id:data.user.id,email:data.user.email,token:data.session.access_token};
}
async function signIn(email,password){
  var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
  if(!r.ok){var e=await r.json();throw new Error(e.error_description||e.msg||'登录失败');}
  var data=await r.json();
  return{id:data.user.id,email:data.user.email,token:data.access_token};
}
async function loadCloudData(){
  if(!currentUser)return null;
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/user_data?select=data&user_id=eq.'+currentUser.id,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+currentUser.token}});
    if(!r.ok)return null;
    var rows=await r.json();
    return rows.length?rows[0].data:null;
  }catch(e){return null;}
}
async function saveCloudData(data){
  if(!currentUser)return;
  try{
    var h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+currentUser.token,'Content-Type':'application/json','Prefer':'return=minimal'};
    var r=await fetch(SUPABASE_URL+'/rest/v1/user_data?user_id=eq.'+currentUser.id,{method:'PATCH',headers:h,body:JSON.stringify({data:data,updated_at:new Date().toISOString()})});
    if(r.status===404)await fetch(SUPABASE_URL+'/rest/v1/user_data',{method:'POST',headers:h,body:JSON.stringify({user_id:currentUser.id,data:data,updated_at:new Date().toISOString()})});
  }catch(e){}
}
function startSync(){
  if(!currentUser||syncTimer)return;
  syncTimer=setInterval(async function(){
    var cloud=await loadCloudData();
    if(cloud){var local=dumpState();var merged=deepMerge(local,cloud);if(JSON.stringify(merged)!==JSON.stringify(local)){applyState(merged);saveLocalState(merged);renderApp();}}
  },5000);
}
function deepMerge(local,remote){
  if(!remote)return local;
  var r={tasks:local.tasks||{},memorials:local.memorials||[],moods:local.moods||{},journals:local.journals||{}};
  if(remote.tasks)for(var k in remote.tasks)r.tasks[k]=remote.tasks[k];
  if(remote.moods)for(var k in remote.moods)r.moods[k]=remote.moods[k];
  if(remote.journals)for(var k in remote.journals)r.journals[k]=remote.journals[k];
  if(remote.memorials){var ids=new Set(r.memorials.map(function(m){return m.id}));for(var i=0;i<remote.memorials.length;i++)if(!ids.has(remote.memorials[i].id))r.memorials.push(remote.memorials[i]);}
  return r;
}
function dumpState(){return{tasks:state.tasksByDate,memorials:state.memorials,moods:state.moods,journals:state.journals};}
function applyState(data){if(data.tasks)state.tasksByDate=data.tasks;if(data.memorials)state.memorials=data.memorials;if(data.moods)state.moods=data.moods;if(data.journals)state.journals=data.journals;}
function updateLoginBtn(){var b=document.getElementById('btn-login');if(b)b.textContent=currentUser?'已登录':'登录';}

// ==================== 持久化 ====================
function loadLocalState(){try{var r=localStorage.getItem(STORAGE_KEY);if(r)applyState(JSON.parse(r));}catch(e){}}
function saveLocalState(data){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:4,tasks:state.tasksByDate,memorials:state.memorials,moods:state.moods,journals:state.journals}));}catch(e){}}
async function loadState(){
  var now=new Date();state.currentYear=now.getFullYear();state.currentMonth=now.getMonth();state.selectedDate=getTodayKey();
  if(currentUser){var cloud=await loadCloudData();if(cloud){var local=dumpState();var merged=deepMerge(local,cloud);applyState(merged);saveLocalState(merged);}else{saveCloudData(dumpState());}startSync();}
  else{loadLocalState();}
}
async function saveState(){var d=dumpState();saveLocalState(d);if(currentUser)await saveCloudData(d);}

function getLegalHoliday(y,m,d){
  var sched=getHoliday(y,m,d);
  if(sched)return{name:sched.n,isRest:sched.t==='rest',isWork:sched.t==='work'};
  var lunar=solarToLunar(y,m,d);
  if(!lunar.isLeap){
    if(lunar.lunarMonth===1&&lunar.lunarDay===1)return{name:'春节',isRest:false};
    if(lunar.lunarMonth===1&&lunar.lunarDay===15)return{name:'元宵节',isRest:false};
    if(lunar.lunarMonth===5&&lunar.lunarDay===5)return{name:'端午',isRest:false};
    if(lunar.lunarMonth===8&&lunar.lunarDay===15)return{name:'中秋',isRest:false};

function getMemSolarDate(mem,year){if(mem.calendar==='solar')return{year:year,month:mem.month,day:mem.day};return lunarToSolar(year,mem.lunarMonth,mem.lunarDay,mem.lunarIsLeap||false);}
function getMemorialsForDate(dk){
  var parts=dk.split('-'),y=+parts[0],mm=+parts[1],d=+parts[2],check=new Date(y,mm-1,d),results=[];
  for(var i=0;i<state.memorials.length;i++){
    var mem=state.memorials[i];
    if(mem.repeat==='yearly'){var sd=getMemSolarDate(mem,y);if(sd.month===mm&&sd.day===d)results.push(mem);}
    else if(mem.repeat==='monthly'){var od=mem.day||mem.lunarDay||1;if(d===Math.min(od,daysInMonth(y,mm-1)))results.push(mem);}
    else if(mem.repeat==='weekly'){var orig=new Date(mem.originalYear||y,(mem.month||1)-1,mem.day||1);if(check.getDay()===orig.getDay())results.push(mem);}
    else{var sd2=getMemSolarDate(mem,mem.originalYear||y);if(sd2.month===mm&&sd2.day===d&&mem.originalYear===y)results.push(mem);}
  }

function getUpcomingMemorials(limit){
  var today=new Date();today.setHours(0,0,0,0);var up=[],seen=new Set();
  for(var o=0;o<365;o++){var d=new Date(today.getTime()+o*86400000),k=dateKey(d.getFullYear(),d.getMonth(),d.getDate()),ms=getMemorialsForDate(k);for(var i=0;i<ms.length;i++){if(!seen.has(ms[i].id)){seen.add(ms[i].id);up.push({mem:ms[i],dateKey:k,daysUntil:o});}}if(up.length>=limit)break;}
  return up;
}

function getMonthGridData(y,m){
  var firstDay=new Date(y,m,1),startIdx=(firstDay.getDay()+6)%7,total=daysInMonth(y,m);
  var prevTotal=daysInMonth(m===0?y-1:y,m===0?11:m-1),cells=[];
  for(var i=startIdx-1;i>=0;i--)cells.push({year:m===0?y-1:y,month:m===0?11:m-1,day:prevTotal-i,curMonth:false});
  for(var d=1;d<=total;d++)cells.push({year:y,month:m,day:d,curMonth:true});
  var rem=(7-cells.length%7)%7;
  for(var d=1;d<=rem;d++)cells.push({year:m===11?y+1:y,month:m===11?0:m+1,day:d,curMonth:false});
  return cells;
}

  h+='<div class="memorial-section"><button class="btn-add-memorial" id="btn-add-memorial" style="width:38px;height:38px;border-radius:50%;font-size:1.4rem;line-height:1;padding:0;border:2px dashed var(--border);background:var(--bg-card);cursor:pointer;color:var(--text-muted);">+</button></div>';
  var upc=getUpcomingMemorials(5);if(upc.length){h+='<div class="memorial-section"><h4>即将到来</h4>';for(var u=0;u<upc.length;u++){var um=upc[u];h+='<div class="memorial-item"><span>'+(MEM_ICONS[um.mem.type]||'📌')+'</span> '+um.mem.name+'<span class="memorial-countdown">'+(um.daysUntil===0?'今天!':'还有'+um.daysUntil+'天')+'</span></div>';}h+='</div>';}
  var urg=[];for(var d2=0;d2<=7;d2++){var cd=new Date(new Date(getTodayKey()+'T00:00:00').getTime()+d2*86400000),ck=dateKey(cd.getFullYear(),cd.getMonth(),cd.getDate()),tks=(state.tasksByDate[ck]||[]).filter(function(t){return!t.done&&(t.priority||0)>=3});for(var t2=0;t2<tks.length;t2++)urg.push({text:tks[t2].text,daysLeft:d2});}
  if(urg.length){h+='<div class="memorial-section"><h4>紧急重要</h4>';for(var u2=0;u2<Math.min(urg.length,5);u2++)h+='<div class="memorial-item"><span>🚨</span> '+urg[u2].text+'<span class="memorial-countdown">'+(urg[u2].daysLeft===0?'今天!':'还有'+urg[u2].daysLeft+'天')+'</span></div>';h+='</div>';}
  h+='<div class="sync-section"><button class="sync-btn" id="btn-export">📤 导出</button><button class="sync-btn" id="btn-import">📥 导入</button></div>';

  var dots=document.querySelectorAll('#priority-sel .priority-dot');for(var pi=0;pi<dots.length;pi++){dots[pi].onclick=function(){var dd=document.querySelectorAll('#priority-sel .priority-dot');for(var x=0;x<dd.length;x++)dd[x].classList.remove('sel');this.classList.add('sel');state.priorityFilter=+this.dataset.p;};}
  var ml=document.getElementById('mood-label');if(ml)ml.onclick=function(){showMoodPopup(dk);};

}

// ==================== 年月选择器 ====================
function renderYearPicker(){
  var h='<h3>选择年份</h3><div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px"><button id="ydown">«</button><input type="number" id="yinput" value="'+state.currentYear+'" min="1900" max="2100" style="width:80px;text-align:center;padding:6px;border:2px solid #ddd;border-radius:8px"><button id="yup">»</button></div><button class="btn-cancel" id="yclose" style="display:block;margin:0 auto">关闭</button>';
  yearPP.innerHTML=h;
  document.getElementById('yinput').onchange=function(){jumpTo(+this.value,state.currentMonth);yearOL.style.display='none';};
  document.getElementById('ydown').onclick=function(){document.getElementById('yinput').value=Math.max(1900,state.currentYear-10);};
  document.getElementById('yup').onclick=function(){document.getElementById('yinput').value=Math.min(2100,state.currentYear+10);};
  document.getElementById('yclose').onclick=function(){yearOL.style.display='none';};
}
function renderMonthPicker(){
  var h='<h3>选择月份</h3><div class="picker-grid">';for(var i=0;i<12;i++)h+='<div class="picker-item'+(i===state.currentMonth?' active':'')+'" data-m="'+i+'">'+(i+1)+'月</div>';h+='</div><button class="btn-cancel" id="mclose" style="display:block;margin:8px auto 0">关闭</button>';
  monthPP.innerHTML=h;var its=monthPP.querySelectorAll('.picker-item');for(var j=0;j<its.length;j++)its[j].onclick=function(){jumpTo(state.currentYear,+this.dataset.m);monthOL.style.display='none';};
  document.getElementById('mclose').onclick=function(){monthOL.style.display='none';};
}
function jumpTo(y,m){state.currentYear=y;state.currentMonth=m;if(state.selectedDate){var parts=state.selectedDate.split('-');state.selectedDate=dateKey(y,m,Math.min(+parts[2],daysInMonth(y,m)));}renderApp();}

// ==================== 心情弹窗 ====================
function showMoodPopup(dk){
  var cur=state.moods[dk]||'',h='<h3>选择心情</h3><div class="mood-grid">';
  for(var i=0;i<MOOD_EMOJIS.length;i++)h+='<button class="mood-btn'+(cur===MOOD_EMOJIS[i]?' sel2':'')+'" data-mood="'+MOOD_EMOJIS[i]+'">'+MOOD_EMOJIS[i]+'</button>';
  h+='</div><div style="text-align:center;margin-top:10px"><button class="btn-cancel" id="mclear">清除</button><button class="btn-cancel" id="mclose2" style="margin-left:6px">关闭</button></div>';
  memBox.innerHTML=h;memModal.style.display='flex';
  var bs=memBox.querySelectorAll('.mood-btn');for(var j=0;j<bs.length;j++){bs[j].onclick=function(){var m=this.dataset.mood;if(state.moods[dk]===m)delete state.moods[dk];else state.moods[dk]=m;saveState();memModal.style.display='none';renderApp();};}
  document.getElementById('mclear').onclick=function(){delete state.moods[dk];saveState();memModal.style.display='none';renderApp();};
  document.getElementById('mclose2').onclick=function(){memModal.style.display='none';};
}

// ==================== 纪念日表单 ====================
var editingMemId=null;
function showMemorialForm(dk,editMem){
  editingMemId=editMem?editMem.id:null;var parts=dk.split('-'),y=+parts[0],mm=+parts[1],d=+parts[2],lunar=solarToLunar(y,mm-1,d);
  var h='<h3>'+(editMem?'编辑':'添加')+'纪念日</h3><label>类型</label><select id="mem-type">';
  for(var k in MEM_TYPES)h+='<option value="'+k+'"'+(editMem&&editMem.type===k?' selected':'')+'>'+MEM_TYPES[k]+'</option>';
  h+='</select><label>名称</label><input type="text" id="mem-name" value="'+(editMem?editMem.name:'')+'" placeholder="如：妈妈生日"><label>日历</label><select id="mem-cal"><option value="solar"'+(editMem&&editMem.calendar==='solar'?' selected':'')+'>阳历</option><option value="lunar"'+(editMem&&editMem.calendar==='lunar'?' selected':'')+'>阴历</option></select>';
  h+='<div id="mem-solar"><label>日期</label><input type="date" id="mem-solar-date" value="'+dk+'"></div>';
  h+='<div id="mem-lunar" style="display:none"><label>农历月</label><select id="mem-lunar-month">';for(var i=0;i<12;i++)h+='<option value="'+i+'"'+(editMem&&editMem.lunarMonth===i?' selected':(lunar.lunarMonth-1===i?' selected':''))+'>'+LUNAR_MONTHS[i]+'月</option>';h+='</select><label>农历日</label><select id="mem-lunar-day">';for(var j=1;j<=30;j++)h+='<option value="'+j+'"'+(editMem&&editMem.lunarDay===j?' selected':(lunar.lunarDay===j?' selected':''))+'>'+(LUNAR_DAYS[j]||j)+'</option>';h+='</select><label><input type="checkbox" id="mem-lunar-isleap"'+(editMem&&editMem.lunarIsLeap?' checked':'')+'> 闰月</label></div>';
  h+='<label>重复</label><select id="mem-repeat"><option value="yearly"'+(editMem&&editMem.repeat==='yearly'?' selected':'')+'>每年</option><option value="monthly"'+(editMem&&editMem.repeat==='monthly'?' selected':'')+'>每月</option><option value="weekly"'+(editMem&&editMem.repeat==='weekly'?' selected':'')+'>每周</option><option value="once"'+(editMem&&editMem.repeat==='once'?' selected':'')+'>仅一次</option></select>';
  h+='<div class="btn-row" style="margin-top:10px;justify-content:flex-end">';if(editMem)h+='<button class="btn-delete" id="btn-del-mem">删除</button>';h+='<button class="btn-cancel" id="mem-cancel">取消</button><button class="btn-save" id="mem-save">保存</button></div>';
  memBox.innerHTML=h;memModal.style.display='flex';
  document.getElementById('mem-cal').onchange=function(){document.getElementById('mem-solar').style.display=this.value==='solar'?'block':'none';document.getElementById('mem-lunar').style.display=this.value==='lunar'?'block':'none';};
  document.getElementById('mem-cancel').onclick=function(){memModal.style.display='none';};
  document.getElementById('mem-save').onclick=function(){
    var name=sanitize(document.getElementById('mem-name').value);if(!name){alert('请输入名称');return;}
    var cal=document.getElementById('mem-cal').value,m={id:editingMemId||genId(),type:document.getElementById('mem-type').value,name:name,calendar:cal,repeat:document.getElementById('mem-repeat').value,originalYear:y};
    if(cal==='solar'){var sd=document.getElementById('mem-solar-date').value.split('-');m.month=+sd[1];m.day=+sd[2];}
    else{m.lunarMonth=+document.getElementById('mem-lunar-month').value;m.lunarDay=+document.getElementById('mem-lunar-day').value;m.lunarIsLeap=document.getElementById('mem-lunar-isleap').checked;}
    if(editingMemId)state.memorials=state.memorials.filter(function(x){return x.id!==editingMemId;});
    state.memorials.push(m);saveState();memModal.style.display='none';renderApp();
  };
  if(editMem)document.getElementById('btn-del-mem').onclick=function(){if(confirm('确定删除「'+editMem.name+'」？')){state.memorials=state.memorials.filter(function(x){return x.id!==editingMemId;});saveState();memModal.style.display='none';renderApp();}};
}

// ==================== 纪念日详情弹窗 ====================
function showMemDetailPopup(mem){
  var icon=MEM_ICONS[mem.type]||'📌',cl=mem.calendar==='lunar'?'农历':'阳历',rl={yearly:'每年',once:'仅一次',weekly:'每周',monthly:'每月'};
  var h='<h3>纪念日详情</h3><div style="text-align:center;font-size:2rem">'+icon+'</div><div style="text-align:center;font-size:1.1rem;font-weight:700">'+mem.name+'</div><div style="text-align:center;color:#999;font-size:0.8rem">'+MEM_TYPES[mem.type]+' · '+cl+' · '+(rl[mem.repeat]||mem.repeat)+'</div>';
  if(mem.type==='countup'||mem.type==='countdown'){var oo=new Date((mem.originalYear||2024)+'-'+String(mem.month||1).padStart(2,'0')+'-'+String(mem.day||1).padStart(2,'0')+'T00:00:00'),tt=new Date(getTodayKey()+'T00:00:00'),df=Math.floor((tt-oo)/86400000);if(mem.type==='countup')h+='<div style="text-align:center;color:var(--mint);font-size:1rem;margin:8px 0">自 '+(mem.originalYear||2024)+'年'+(mem.month||1)+'月'+(mem.day||1)+'日 起<br>至今已 <b>'+(df>=0?df+1:Math.abs(df))+'</b> 天</div>';else h+='<div style="text-align:center;color:#E74C3C;font-size:1rem;margin:8px 0">距离 '+(mem.originalYear||2024)+'年'+(mem.month||1)+'月'+(mem.day||1)+'日<br>还有 <b>'+(df>=0?df:Math.abs(df))+'</b> 天</div>';}
  h+='<div class="btn-row" style="justify-content:center;margin-top:12px"><button class="btn-save" id="popup-edit">编辑</button><button class="btn-delete" id="popup-del">删除</button><button class="btn-cancel" id="popup-close">关闭</button></div>';
  memBox.innerHTML=h;memModal.style.display='flex';
  document.getElementById('popup-close').onclick=function(){memModal.style.display='none';};
  document.getElementById('popup-edit').onclick=function(){memModal.style.display='none';showMemorialForm(dateKey(state.currentYear,state.currentMonth,1),mem);};
  document.getElementById('popup-del').onclick=function(){if(confirm('确定删除「'+mem.name+'」？')){state.memorials=state.memorials.filter(function(x){return x.id!==mem.id;});saveState();memModal.style.display='none';renderApp();}};
}

// ==================== 导入导出 ====================
function handleExport(){var d={version:4,tasks:state.tasksByDate,memorials:state.memorials,moods:state.moods,journals:state.journals};var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='dopamine-backup-'+getTodayKey()+'.json';a.click();URL.revokeObjectURL(u);}
function handleImport(){var inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(re){try{var d=JSON.parse(re.target.result);if(d.tasks)for(var k in d.tasks)state.tasksByDate[k]=d.tasks[k];if(d.memorials){var ids=new Set(state.memorials.map(function(x){return x.id}));for(var i=0;i<d.memorials.length;i++)if(!ids.has(d.memorials[i].id))state.memorials.push(d.memorials[i]);}if(d.moods)for(var k in d.moods)state.moods[k]=d.moods[k];if(d.journals)for(var k in d.journals)state.journals[k]=d.journals[k];saveState();renderApp();}catch(err){alert('导入失败');}};r.readAsText(f);};inp.click();}

// ==================== 撒花 ====================
function showCelebration(){var n=30,f=document.createDocumentFragment();for(var i=0;i<n;i++){var p=document.createElement('div');p.className='celebration-particle';var s=Math.random()*10+6,c=DOT_COLORS[Math.floor(Math.random()*6)],a=Math.random()*Math.PI*2,d=Math.random()*200+100;p.style.cssText='width:'+s+'px;height:'+s+'px;background:'+c+';top:50%;left:50%;--dx:'+Math.cos(a)*d+'px;--dy:'+(Math.sin(a)*d-100)+'px;--rot:'+((Math.random()-0.5)*720)+'deg;animation-delay:'+(Math.random()*0.3)+'s';f.appendChild(p);}document.body.appendChild(f);setTimeout(function(){var ps=document.querySelectorAll('.celebration-particle');for(var j=0;j<ps.length;j++)ps[j].remove();},1600);}

// ==================== 提醒弹窗 ====================
function showReminderPopup(){
  var today=getTodayKey();if(localStorage.getItem('popupDismissed')===today)return;
  var upc=getUpcomingMemorials(30),ma=upc.filter(function(u){return u.daysUntil>0&&u.daysUntil<=7}),ta=[];
  for(var d=0;d<=5;d++){var cd=new Date(new Date(today+'T00:00:00').getTime()+d*86400000),ck=dateKey(cd.getFullYear(),cd.getMonth(),cd.getDate()),tks=(state.tasksByDate[ck]||[]).filter(function(t){return!t.done&&(t.priority||0)>=3});for(var t=0;t<tks.length;t++)ta.push({text:tks[t].text,daysLeft:d});}
  if(!ma.length&&!ta.length)return;
  var msg='<h3 style="text-align:center">今日提醒</h3><div style="max-height:200px;overflow-y:auto">';
  if(ma.length){msg+='<div style="font-weight:600;color:var(--mint)">纪念日</div>';for(var a=0;a<ma.length;a++)msg+='<div style="padding:3px 0;border-bottom:1px solid #f0f0f0">'+(MEM_ICONS[ma[a].mem.type]||'📌')+' <b>'+ma[a].mem.name+'</b> — '+ma[a].daysUntil+'天后'+(ma[a].daysUntil<=3?' 🔔':'')+'</div>';}
  if(ta.length){msg+='<div style="font-weight:600;color:#E74C3C;margin-top:6px">紧急重要</div>';for(var b=0;b<ta.length;b++)msg+='<div style="padding:3px 0;border-bottom:1px solid #f0f0f0;color:#E74C3C">🚨 <b>'+ta[b].text+'</b> — '+(ta[b].daysLeft===0?'今天!':ta[b].daysLeft+'天后')+'</div>';}
  msg+='</div><div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between"><label style="font-size:0.75rem;color:#999;cursor:pointer"><input type="checkbox" id="popup-dismiss"> 今日不再提醒</label><button class="btn-cancel" id="popup-close" style="margin:0">关闭</button></div>';
  var ov=document.createElement('div');ov.className='picker-overlay show';ov.style.zIndex='500';ov.id='reminder-popup';ov.innerHTML='<div class="picker-popup">'+msg+'</div>';document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov||e.target.id==='popup-close'){if(document.getElementById('popup-dismiss')&&document.getElementById('popup-dismiss').checked)localStorage.setItem('popupDismissed',today);ov.remove();}});
}

// ==================== 事件处理 ====================
function handleHeaderClick(action){
  if(action==='prev'){if(state.currentMonth===0){state.currentYear--;state.currentMonth=11;}else state.currentMonth--;}
  else if(action==='next'){if(state.currentMonth===11){state.currentYear++;state.currentMonth=0;}else state.currentMonth++;}
  else if(action==='today'){var n=new Date();state.currentYear=n.getFullYear();state.currentMonth=n.getMonth();state.selectedDate=getTodayKey();}
  renderApp();
}
function handleCalendarClick(dk,cellEl){
  if(cellEl&&cellEl.classList.contains('other-month')){var p=dk.split('-');state.currentYear=+p[0];state.currentMonth=+p[1]-1;}
  state.selectedDate=dk;state.priorityFilter=null;renderApp();
}
function handleAddTask(){var inp=document.getElementById('task-input');if(!inp)return;addTask(state.selectedDate,inp.value,state.priorityFilter||0);inp.value='';state.priorityFilter=null;renderApp();setTimeout(function(){var ni=document.getElementById('task-input');if(ni)ni.focus();},20);}
function handleToggleTask(tid){if(!state.selectedDate)return;toggleTask(state.selectedDate,tid);renderApp();}
function handleDeleteTask(tid){if(!state.selectedDate)return;deleteTask(state.selectedDate,tid);renderApp();}

app.addEventListener('click',function(e){
  var ab=e.target.closest('[data-action]');if(ab){handleHeaderClick(ab.dataset.action);return;}
  var cell=e.target.closest('.calendar-cell');if(cell){handleCalendarClick(cell.dataset.date,cell);return;}
  var del=e.target.closest('.task-delete');if(del){var ti=del.closest('.task-item');if(ti)handleDeleteTask(ti.dataset.taskId);return;}
  var mc=e.target.closest('.memorial-clickable');if(mc){var mem=state.memorials.find(function(m){return m.id===mc.dataset.memorialId});if(mem)showMemDetailPopup(mem);return;}
  if(e.target===yearTxt){yearOL.style.display='flex';return;}
  if(e.target===monthTxt){monthOL.style.display='flex';return;}
  if(e.target===yearOL){yearOL.style.display='none';return;}
  if(e.target===monthOL){monthOL.style.display='none';return;}
  if(e.target===memModal){memModal.style.display='none';return;}
  var lm=document.getElementById('login-modal');if(lm&&e.target===lm){lm.style.display='none';return;}
});
app.addEventListener('change',function(e){
  var cb=e.target.closest('.task-checkbox');if(cb){var ti=cb.closest('.task-item');if(ti)handleToggleTask(ti.dataset.taskId);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'&&e.ctrlKey){e.preventDefault();handleHeaderClick('prev');}
  else if(e.key==='ArrowRight'&&e.ctrlKey){e.preventDefault();handleHeaderClick('next');}
  else if(e.key==='t'&&e.ctrlKey){e.preventDefault();handleHeaderClick('today');}
});

// ==================== 初始化 ====================
// 帮助/新手引导
function showHelp(){
  var steps=[
    {t:'日历',d:'点击任意日期查看和添加任务。◀ ▶ 切换月份，点击年份/月份快速跳转。'},
    {t:'任务',d:'输入任务后点添加。<br>可设优先级：<br>○ 普通<br>⭐ 重要<br>🔥 紧急<br>🚨 重要且紧急<br>勾选完成会撒花！'},
    {t:'纪念日',d:'点 ＋ 添加纪念日，支持生日/节日/正数日/倒数日。可设阳历或阴历循环。'},
    {t:'心情',d:'点 😊 方块选择今日心情，下方写每日总结。数据自动保存。'},
    {t:'同步',d:'点 登录 注册账号后，电脑/手机/平板数据自动同步。同一账号登录即可。'},
  ];
  var idx=0,box=document.getElementById('login-modal-box'),modal=document.getElementById('login-modal');
  function show(i){
    var s=steps[i];
    box.innerHTML='<h3 style="text-align:center">'+s.t+'</h3><p style="text-align:center;padding:12px;color:#636E72;line-height:1.8">'+s.d+'</p><div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn-cancel" id="help-prev"'+(i===0?' disabled':'')+'>上一步</button><span style="color:#999;font-size:0.8rem;line-height:2">'+(i+1)+'/'+steps.length+'</span><button class="btn-save" id="help-next">'+(i===steps.length-1?'完成':'下一步')+'</button></div>';
    modal.style.display='flex';
    document.getElementById('help-prev').onclick=function(){if(i>0)show(i-1);};
    document.getElementById('help-next').onclick=function(){if(i<steps.length-1)show(i+1);else modal.style.display='none';};
  }
  show(0);
}

function init(){
  loadLocalState();renderApp();
  // 新手引导
  if(!localStorage.getItem('dopamineTutorialDone')){setTimeout(showHelp,800);localStorage.setItem('dopamineTutorialDone','1');}
  setTimeout(showReminderPopup,500);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
}
init();
console.log('脚本加载完成');
</script>
